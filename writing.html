<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>writing — tambirmutee</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"><style>
/* Single committed world: dark CRT phosphor terminal. Mono-only type.
   bold element = the booting whoami terminal + glitch wordmark; everything else quiet. */
:root{
  --bg:#05080A; --bg2:#070C0E; --panel:#0A1013; --panel2:#0D1518;
  --line:#13241D; --line2:#1C3328;
  --grn:#36F5A3; --grn-hi:#B6FFDC; --grn-dim:#1E8A61; --grn-fade:#14503A;
  --amber:#FFB23E; --red:#FF5C57; --cyan:#45D7E0;
  --fg:#BFE9D6; --muted:#5E8A78; --faint:#3C5D50;
  --sev-crit:#FF5C57; --sev-high:#FFA23E; --sev-med:#E8D44C; --sev-low:#45D7E0;
  --max:1060px;
  --disp:"Share Tech Mono",ui-monospace,monospace;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg); font-family:var(--mono); font-size:14px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
  background-image:
     radial-gradient(1200px 600px at 70% -10%, rgba(54,245,163,.05), transparent 60%),
     radial-gradient(900px 500px at -10% 110%, rgba(69,215,224,.04), transparent 55%);
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}
::selection{background:var(--grn);color:#02130C}
:focus-visible{outline:2px solid var(--grn);outline-offset:3px}

/* CRT scanline + vignette overlay */
.crt{position:fixed;inset:0;pointer-events:none;z-index:60;mix-blend-mode:overlay;opacity:.5;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.vig{position:fixed;inset:0;pointer-events:none;z-index:59;
  box-shadow:inset 0 0 160px 30px rgba(0,0,0,.65)}
@media (prefers-reduced-motion:no-preference){
  .flick{position:fixed;inset:0;pointer-events:none;z-index:61;background:rgba(54,245,163,.015);
    animation:flick 7s steps(60) infinite}
  @keyframes flick{0%,97%,100%{opacity:0}98%{opacity:.5}99%{opacity:.1}}
}

.wrap{max-width:var(--max);margin:0 auto;padding-inline:clamp(16px,5vw,34px)}

/* ---- top terminal bar / nav ---- */
.bar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line2);
  padding-top:env(safe-area-inset-top,0px)}
.bar-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:54px;padding-block:8px}
.logo{font-family:var(--mono);font-weight:700;letter-spacing:-.01em;color:var(--grn-hi);white-space:nowrap}
.logo b{color:var(--grn)}
.logo .bk{color:var(--grn);animation:blink 1.1s step-end infinite}
.navl{display:flex;gap:4px 6px;flex-wrap:wrap;margin-left:auto}
.navl a{font-size:.82rem;color:var(--muted);padding:5px 9px;border:1px solid transparent;border-radius:5px;transition:color .14s,border-color .14s,background .14s}
.navl a::before{content:"./";color:var(--faint)}
.navl a:hover{color:var(--grn-hi)}
.navl a.cur{color:var(--grn);border-color:var(--grn-fade);background:rgba(54,245,163,.06)}
.navl a.cur::before{color:var(--grn-dim)}
.lang{font-family:var(--mono);font-size:.78rem;font-weight:600;color:var(--muted);background:transparent;
  border:1px solid var(--line2);border-radius:5px;padding:5px 9px;cursor:pointer}
.lang:hover{color:var(--grn-hi);border-color:var(--grn-fade)}
.lang .m{opacity:.35}.lang .m.on{opacity:1;color:var(--grn)}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.bk{animation:none}}

/* ---- page scaffold ---- */
main{min-height:62vh;padding-block:clamp(26px,5vw,52px) 60px}
.phead{font-family:var(--mono);font-size:.82rem;color:var(--muted);margin:0 0 6px}
.phead .u{color:var(--grn)}.phead .p{color:var(--amber)}.phead .cmd{color:var(--grn-hi)}
.ptitle{font-family:var(--disp);font-size:clamp(1.9rem,6vw,3rem);color:var(--grn-hi);
  letter-spacing:.01em;margin:4px 0 22px;line-height:1;text-shadow:0 0 18px rgba(54,245,163,.25)}
.ret{display:inline-flex;gap:8px;align-items:center;margin-top:34px;color:var(--muted);font-size:.84rem}
.ret:hover{color:var(--grn)}
.ret b{color:var(--grn)}

/* ---- home hero ---- */
.hero{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(26px,5vw,48px);align-items:center;
  padding-top:clamp(18px,4vw,40px)}
.glitch{font-family:var(--disp);font-weight:400;font-size:clamp(2rem,8.4vw,3.7rem);line-height:1.04;
  color:var(--grn);margin:0;letter-spacing:.02em;max-width:100%;overflow-wrap:anywhere;
  text-shadow:0 0 1px rgba(54,245,163,.5),0 0 15px rgba(54,245,163,.3)}
.glitch .cur{display:inline-block;width:.5em;height:.9em;margin-left:.08em;background:var(--grn);
  vertical-align:-2px;box-shadow:0 0 10px var(--grn);animation:blink 1.1s step-end infinite}
@media (prefers-reduced-motion:reduce){.glitch .cur{animation:none}}
.subrole{font-size:clamp(.95rem,2.4vw,1.15rem);color:var(--grn);margin:18px 0 0;font-weight:500}
.subrole .s{color:var(--faint)}
.helLede{color:var(--muted);max-width:44ch;margin:14px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.stat{border:1px solid var(--line2);border-radius:6px;padding:7px 11px;font-size:.78rem;color:var(--fg);background:var(--panel)}
.stat b{color:var(--grn)}
.cta{display:flex;flex-wrap:wrap;gap:11px;margin-top:24px}
.btn{font-family:var(--mono);font-size:.84rem;font-weight:600;padding:10px 17px;border-radius:6px;
  border:1px solid var(--line2);cursor:pointer;transition:transform .12s,border-color .14s,background .14s,color .14s;
  display:inline-flex;gap:8px;align-items:center}
.btn:hover{transform:translateY(-1px)}
.btn-p{background:var(--grn);color:#02130C;border-color:var(--grn)}
.btn-p:hover{background:var(--grn-hi)}
.btn-g:hover{border-color:var(--grn-fade);color:var(--grn)}
@media (max-width:820px){.hero{grid-template-columns:1fr}.term{order:2}}

/* terminal panel */
.term{background:var(--panel);border:1px solid var(--line2);border-radius:9px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(54,245,163,.04),0 26px 60px -34px rgba(0,0,0,.8)}
.tbar{display:flex;align-items:center;gap:7px;padding:10px 13px;border-bottom:1px solid var(--line);background:var(--panel2)}
.d{width:11px;height:11px;border-radius:50%}.d.r{background:#FF5C57}.d.y{background:#FFB23E}.d.g{background:#36F5A3}
.ttl{font-size:.72rem;color:var(--faint);margin-left:7px}
.tbody{padding:16px 16px 18px;font-size:.8rem;line-height:1.75;white-space:pre-wrap;word-break:break-word;min-height:250px}
.tbody .p{color:var(--amber)}.tbody .c{color:var(--grn-hi);font-weight:600}
.tbody .k{color:var(--grn)}.tbody .o{color:var(--fg)}
.car{display:inline-block;width:8px;height:1.05em;background:var(--grn);transform:translateY(2px);
  box-shadow:0 0 8px var(--grn);animation:blink 1.05s step-end infinite}
@media (prefers-reduced-motion:reduce){.car{animation:none}}

/* ---- generic content ---- */
.lede{color:var(--muted);max-width:60ch}
.prose p{max-width:66ch;color:var(--fg);margin:0 0 14px}
.prose p:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(22px,4vw,44px);align-items:start}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}

.card{border:1px solid var(--line2);border-radius:9px;background:var(--panel);padding:18px}
.card h3{font-family:var(--mono);font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:0 0 14px;font-weight:600}
.focus ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.focus li{display:flex;align-items:center;gap:11px;font-size:.86rem}
.sev{width:9px;height:9px;border-radius:2px;flex:none;box-shadow:0 0 7px currentColor}

/* experience */
.xp{list-style:none;margin:0;padding:0 0 0 24px;position:relative}
.xp::before{content:"";position:absolute;left:4px;top:7px;bottom:7px;width:1px;background:var(--line2)}
.xp li{position:relative;padding:0 0 28px}
.xp li:last-child{padding-bottom:0}
.xp li::before{content:"";position:absolute;left:-24px;top:7px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:2px solid var(--grn-dim)}
.xp li.now::before{background:var(--grn);border-color:var(--grn);box-shadow:0 0 0 4px rgba(54,245,163,.18),0 0 10px var(--grn)}
.xtop{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 12px}
.xrole{font-weight:600;color:var(--fg);font-size:1.02rem}
.xorg{color:var(--grn);font-weight:600}
.xmeta{margin-left:auto;font-size:.74rem;color:var(--faint);white-space:nowrap}
.xp p{margin:9px 0 11px;color:var(--muted);max-width:70ch;font-size:.93rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 8px;background:var(--bg2)}
.subh{font-family:var(--mono);font-size:.72rem;color:var(--faint);text-transform:uppercase;letter-spacing:.14em;margin:36px 0 18px;font-weight:600}
.subh::before{content:"// "}

/* certs */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.cgrid.flag{margin-bottom:13px}
.cert{border:1px solid var(--line2);border-radius:8px;padding:15px;background:var(--panel);transition:border-color .14s,transform .12s;min-width:0}
.cert:hover{border-color:var(--grn-fade);transform:translateY(-2px)}
.cert.f{border-color:var(--grn-fade);box-shadow:0 0 0 1px rgba(54,245,163,.06)}
.cabbr{font-family:var(--disp);font-size:1.25rem;color:var(--fg);display:flex;align-items:center;gap:9px;letter-spacing:.02em}
.cert.f .cabbr{color:var(--grn-hi);text-shadow:0 0 14px rgba(54,245,163,.3)}
.cstar{font-family:var(--mono);font-size:.56rem;color:var(--grn);border:1px solid var(--grn-fade);border-radius:20px;padding:2px 7px;font-weight:600;letter-spacing:.06em}
.cname{font-size:.82rem;color:var(--fg);margin:9px 0 2px;line-height:1.35}
.ciss{font-size:.76rem;color:var(--muted)}
.cfoot{display:flex;justify-content:space-between;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line);font-size:.66rem;color:var(--faint)}
.cid{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
@media(max-width:720px){.cgrid{grid-template-columns:1fr 1fr;gap:10px}}
@media(max-width:440px){.cgrid{grid-template-columns:1fr}}

/* skills */
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(16px,3vw,26px)}
.sgrp h3{font-family:var(--mono);font-size:.82rem;color:var(--fg);margin:0 0 12px;font-weight:600}
.sgrp h3 .n{color:var(--grn);margin-right:7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:.8rem;color:var(--fg);border:1px solid var(--line2);border-radius:5px;padding:6px 10px;background:var(--panel)}
.chip::before{content:"▹ ";color:var(--grn-dim)}
@media(max-width:620px){.skills{grid-template-columns:1fr}}

/* writing */
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.lcard{display:block;border:1px solid var(--line2);border-radius:8px;padding:17px;background:var(--panel);transition:border-color .14s,transform .12s;min-width:0}
.lcard:hover{border-color:var(--grn-fade);transform:translateY(-2px)}
.lt{font-weight:600;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;color:var(--grn-hi)}
.lt .a{color:var(--grn)}
.lu{font-size:.72rem;color:var(--grn);margin-top:3px;word-break:break-all}
.ld{color:var(--muted);font-size:.83rem;margin-top:9px}
@media(max-width:720px){.links{grid-template-columns:1fr}}

/* contact */
.erow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 20px}
.email{font-size:1rem;color:var(--grn-hi);border:1px solid var(--line2);border-radius:6px;padding:10px 14px;background:var(--panel);user-select:all}
.copy{font-family:var(--mono);font-size:.78rem;font-weight:600;color:var(--grn);background:transparent;border:1px solid var(--grn-fade);border-radius:6px;padding:10px 14px;cursor:pointer}
.copy:hover{background:rgba(54,245,163,.1)}
.cx{display:flex;flex-direction:column;gap:11px;margin-top:4px}
.cx a{display:flex;gap:10px;color:var(--muted);font-size:.9rem}
.cx a:hover{color:var(--grn)}
.cx a .lbl{font-size:.7rem;color:var(--faint);width:84px;flex:none}
.cx a .lbl::before{content:"["}.cx a .lbl::after{content:"]"}
.avail{font-size:.84rem;color:var(--muted);display:flex;align-items:center;gap:9px;margin-top:2px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);animation:pls 2.2s infinite}
@keyframes pls{0%{box-shadow:0 0 0 0 rgba(54,245,163,.5)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}

footer{border-top:1px solid var(--line2);padding-block:22px 28px}
.fin{display:flex;flex-wrap:wrap;gap:7px 16px;align-items:center;font-size:.72rem;color:var(--faint)}
.fin .hl{color:var(--grn-dim)}
.fin a:hover{color:var(--grn)}

/* ---- tools ---- */
.toolsgrid{display:flex;flex-direction:column;gap:18px}
.tool h3{font-family:var(--mono);font-size:.95rem;color:var(--grn-hi);text-transform:none;letter-spacing:0;margin:0 0 14px;font-weight:600;display:flex;align-items:center}
.tool h3 .ic{color:var(--grn);margin-right:9px;font-family:var(--disp)}
.fld{display:block}
.fld .lab{display:block;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px}
input,select,textarea{font-family:var(--mono);font-size:.85rem;color:var(--fg);background:var(--bg2);
  border:1px solid var(--line2);border-radius:6px;padding:9px 11px;width:100%;max-width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--grn-fade);box-shadow:0 0 0 2px rgba(54,245,163,.1)}
select{cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 150px;min-width:0}
.out{position:relative;margin-top:11px}
.out>pre{font-family:var(--mono);font-size:.78rem;color:var(--grn-hi);background:#02090A;border:1px solid var(--line);
  border-radius:6px;padding:12px 52px 12px 12px;white-space:pre-wrap;word-break:break-all;margin:0;min-height:18px;overflow-x:auto}
.outcopy{position:absolute;top:7px;right:7px;font-family:var(--mono);font-size:.64rem;color:var(--grn);background:#02090A;
  border:1px solid var(--grn-fade);border-radius:5px;padding:4px 7px;cursor:pointer;z-index:2}
.outcopy:hover{background:rgba(54,245,163,.12)}
.ocap{font-size:.64rem;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 -2px}
.tnote{font-size:.74rem;color:var(--faint);margin:12px 0 0}
.tnote::before{content:"// "}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:620px){.cols2{grid-template-columns:1fr}}
/* accordion */
details.card{padding:0}
details.tool>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  padding:15px 18px;font-family:var(--mono);font-size:.95rem;color:var(--grn-hi);font-weight:600}
details.tool>summary::-webkit-details-marker{display:none}
details.tool>summary::marker{content:""}
details.tool>summary:hover{color:var(--grn)}
details.tool>summary .ic{color:var(--grn);font-family:var(--disp)}
details.tool>summary .chev{margin-left:auto;color:var(--grn-dim);transition:transform .18s}
details.tool[open]>summary .chev{transform:rotate(90deg)}
details.tool[open]>summary{border-bottom:1px solid var(--line)}
.tbody2{padding:16px 18px 18px}

}
function certCard(c){
 return '<div class="cert'+(c.flag?' f':'')+'"><div class="cabbr">'+c.a+(c.flag?'<span class="cstar">core</span>':'')+'</div><div class="cname">'+c.n+'</div><div class="ciss">'+c.iss+'</div><div class="cfoot"><span class="cid" title="'+c.id+'">ID '+c.id+'</span><span>'+c.date+'</span></div></div>';
}
function renderCerts(){
 var f=qs('certFlag'),r=qs('certRest');
 if(f)f.innerHTML=CERTS.filter(function(c){return c.flag;}).map(certCard).join('');
 if(r)r.innerHTML=CERTS.filter(function(c){return !c.flag;}).map(certCard).join('');
}

}

function lh(l){ if(l.t!=null)return '<span class="p">'+l.t+'</span><span class="c">'+l.c+'</span>';
 if(l.k!=null)return '<span class="k">'+l.k+'</span>'; return '<span class="o">'+l.o+'</span>'; }
function fullTerm(){return TL.map(lh).join('\n')+'<span class="car"></span>';}
function typeTerm(){
 var node=qs('term'); if(!node)return;
 var red=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
 if(red){node.innerHTML=fullTerm();return;}
 var i=0;
 function nl(){
  if(i>=TL.length){node.innerHTML=fullTerm();return;}
  var l=TL[i];
  if(l.c!=null&&l.c.length){
   var base=TL.slice(0,i).map(lh).join('\n');var ci=0;
   (function tc(){node.innerHTML=(base?base+'\n':'')+'<span class="p">'+l.t+'</span><span class="c">'+l.c.slice(0,ci)+'</span><span class="car"></span>';
    if(ci<l.c.length){ci++;setTimeout(tc,24);}else{i++;setTimeout(nl,170);}})();
  }else{node.innerHTML=TL.slice(0,i+1).map(lh).join('\n')+'<span class="car"></span>';i++;setTimeout(nl,l.o!=null?80:55);}
 }
 node.innerHTML='<span class="car"></span>';setTimeout(nl,240);
}

}
